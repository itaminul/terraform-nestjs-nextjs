apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-app-ingress
  namespace: {{ .Release.Namespace | default "default" }}
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: {{ .Values.ingress.annotations.enableCors | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.annotations.sslRedirect | quote }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.ingress.annotations.rewriteTarget | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # 1. Inventory Service
          - path: /inventory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.services.inventory.name }}
                port:
                  number: {{ .Values.services.inventory.port }}

          # 2. Frontend Route
          - path: /frontend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.services.frontend.name }}
                port:
                  number: {{ .Values.services.frontend.port }}

          # 3. NestJS Dashboard Route
          - path: /dashboard(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.services.api.name }}
                port:
                  number: {{ .Values.services.api.port }}

          # 4. NestJS Root Route fallback
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.services.api.name }}
                port:
                  number: {{ .Values.services.api.port }}
