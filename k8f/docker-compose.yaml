version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      # Bind mount the host directory to the container for hot reloading
      - .:/app
      # Anonymous volume to protect container node_modules from being overwritten by the host
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
