apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-frontend-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-frontend
  template:
    metadata:
      labels:
        app: inventory-frontend
    spec:
      containers:
      - name: inventory-container
        image: inventory-frontend:v1   # 👈 Image tag we will build inside Minikube
        imagePullPolicy: Never
        ports:
        - containerPort: 3001       # 👈 Next.js default node port
